name: Check source chunks

on:
  push:
    branches:
      - main

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash chunks
        shell: bash
        run: |
          set -euo pipefail
          for i in 01 02 03 04 05 06 07 08; do
            f=".upload/src${i}.b64"
            printf "%s chars=" "$i"
            wc -c < "$f" | tr -d ' '
            printf "%s decoded_sha256=" "$i"
            base64 -d "$f" | sha256sum | awk '{print $1}'
          done
          cat .upload/src{01,02,03,04,05,06,07,08}.b64 | base64 -d > /tmp/all.zip
          printf "zip bytes="; wc -c < /tmp/all.zip | tr -d ' '
          printf "zip sha256="; sha256sum /tmp/all.zip | awk '{print $1}'
