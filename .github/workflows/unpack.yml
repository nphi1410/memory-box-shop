name: Finalize Memory Box source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/zip.01.b64 .upload/zip.02.b64 | base64 -d > /tmp/memory-box.zip
          rm -rf /tmp/memory-box-unpack
          mkdir -p /tmp/memory-box-unpack
          unzip -q /tmp/memory-box.zip -d /tmp/memory-box-unpack
          cp -a /tmp/memory-box-unpack/memory-box-local-shop/. .
          rm -rf .upload
          rm -f .github/workflows/unpack.yml

      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: add complete Memory Box local shop"
          git push
